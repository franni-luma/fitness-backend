<!DOCTYPE html>
<html>
<head>
  <title>Fitness Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>Live Puls</h2>
<canvas id="pulseChart"></canvas>

<script>
let chart;

async function loadData() {
  const res = await fetch("/vitals");
  const data = await res.json();

  const pulse = data.map(d => d.pulse).reverse();
  const labels = data.map(d => new Date(d.time).toLocaleTimeString()).reverse();

  if (!chart) {
    chart = new Chart(document.getElementById("pulseChart"), {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: "Puls",
          data: pulse,
          borderColor: "blue"
        }]
      }
    });
  } else {
    chart.data.labels = labels;
    chart.data.datasets[0].data = pulse;
    chart.update();
  }
}

loadData();
setInterval(loadData, 5000); // alle 5 Sekunden aktualisieren
</script>

</body>
</html>
